name: WebOS Virtual MKV Experiment

on:
  push:
    branches:
      - experiment/webos-virtual-mkv-v2.10.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-mkv-webos-modern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and virtual MKV tests
        run: |
          node --check services/virtual-mkv.js
          node --check services/service.js
          node --check src/player/core/WebOSVirtualMkv.js
          node --check src/player/core/WebOSPlayer.js
          node --check src/player/core/JellyfinPlayer.js
          node --test tests/WebOSVirtualMkv.test.js
      - name: Build webOS Modern IPK
        run: npm run package:webos-modern
      - uses: actions/upload-artifact@v4
        with:
          name: Litefin-webOS-virtual-mkv-v2.10.0
          path: Litefin-*-webOS-Modern.ipk
          if-no-files-found: error
          retention-days: 30
