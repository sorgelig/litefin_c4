name: Build WebOS selected audio policy

on:
  push:
    branches:
      - experiment/webos-selected-audio-policy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webos-modern-ipk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Check syntax and virtual MKV range proxy
        run: |
          node --check services/service.js
          node --check services/virtual-mkv.js
          node --check src/player/core/JellyfinPlayer.js
          node --check src/player/core/WebOSPlayer.js
          node --check src/pages/settings/tabs/PlayerTab.js
          node --check src/pages/settings/controllers/SettingsDropdownConfig.js
          node --check src/pages/settings/controllers/SettingsDropdownDispatcher.js
          node --test tests/WebOSVirtualMkv.test.js tests/WebOSEac3Bitrate.test.js tests/WebOSEac3Atmos.test.js tests/PlaybackInfoPlayMethod.test.js tests/TranscodeLabel.test.js
      - name: Build webOS Modern IPK
        run: |
          mkdir -p .sign
          npm run package:webos-modern
      - uses: actions/upload-artifact@v4
        with:
          name: Litefin-webOS-Selected-Audio-Policy
          path: Litefin-*-webOS-Modern.ipk
          if-no-files-found: error
          retention-days: 30
